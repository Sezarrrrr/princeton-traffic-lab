<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffix Lab checks</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px auto; max-width: 760px; padding: 0 16px; color: #1c2430; background: #fff; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #summary { font-weight: 600; margin: 12px 0; }
    #summary.pass { color: #14713d; }
    #summary.fail { color: #b3261e; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 6px 0; border-bottom: 1px solid #e5e9ef; }
    li.fail { color: #b3261e; }
    li small { display: block; color: #5b6675; }
    @media (prefers-color-scheme: dark) {
      body { background: #12161c; color: #e6eaf0; }
      li { border-color: #2a323d; }
      li small { color: #9aa5b4; }
      #summary.pass { color: #5fd08e; }
      #summary.fail, li.fail { color: #ff8a80; }
    }
  </style>
</head>
<body>
  <h1>Traffix Lab: simulator checks</h1>
  <p>Runs the in-browser simulator (<code>sim/engine.js</code>) through fixed scenarios and checks the results. Reload to run again.</p>
  <p id="summary">Running…</p>
  <ul id="results"></ul>

  <script src="geo/princeton-geo.js"></script>
  <script src="geo/princeton-network.js"></script>
  <script src="sim/engine.js"></script>
  <script src="tests.js"></script>
</body>
</html>
